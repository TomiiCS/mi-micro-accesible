<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Micro Accesible</title>
    <link rel="icon" href="assets/favicon.png">
    <link rel="stylesheet" href="/leaflet/leaflet.css">
    <link rel="stylesheet" href="./css/stylesheet.css">
</head>

<body>  
    <header>
        <section class="titulo">
            <img src="./assets/favicon.png" height="60px" width="60px">
            <h1>Mi Micro Accesible</h1> 
            <p>Interfaz accesible para transporte público</p>
        </section>
        <section class="accesibilidad">
            <div class="controles-texto"> 
                <button id="disminuir-fuente" aria-label="Disminuir tamaño de letra" >A-</button><button id="restablecer-fuente" aria-label="Restablecer tamaño de letra ">A</button><button id="aumentar-fuente" aria-label="Aumentar tamaño de letra" >A+</button>
            </div>
            <div class="control-contraste"> 
                <button id="boton-contraste" aria-label="Activar o desactivar el alto contraste"> <img src="./assets/circle-half-stroke-solid.png"><span> Alto contraste</span></button>
            </div>
            <button id="escuchar-pagina" aria-label="Activar o desactivar el modo de lectura de la página" aria-pressed="false">
                <img src="./assets/volume-solid.png">
                <span id="texto-escuchar"> Escuchar página </span>
            </button>
        </section>
    </header>

    <main>
        <nav class="buscador">
             <div class="panel-header"><h2>Consultar recorrido</h2></div>
             <div class="panel-body">
                <div class="campo">
                    <label for="origen">Origen</label>
                    <select id="origen" ></select>
                </div>
                <div class="campo">
                    <label for="destino">Destino</label>
                    <select id="destino" ></select>
                </div>
                <button id="buscar"><img src="./assets/magnifying-glass-solid.png">Buscar recorrido</button>
             </div>
        </nav>
        <section class="recorrido">
            <section class="mapa">
                <div class="panel-header"><h2>Mapa</h2></div>
                <div id="mapa" aria-label="Mapa del recorrido"></div>
            </section>
            <section class="indicaciones">
                <div class="panel-header"><h2>Indicaciones</h2>
                    <button id="escuchar-recorrido" aria-label="Escuchar las indicaciones del recorrido" ><img src="./assets/volume-solid.png">Escuchar Recorrido</button>
                </div>
                <div class="lista-indicaciones">
                    <ol id="lista" aria-live="polite"></ol></ol>
                </div>
            </section>
        </section>
    </main>

    <footer>
        <p>
            Seminario de Lenguajes - JavaScript 
        </p>
    </footer>

    <script src="/leaflet/leaflet.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>

</html>
